<!doctype html>
<html lang="sr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hunt. — iPhone deal scanner</title>
    <meta name="theme-color" content="#ffffff" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <!-- Fonts are loaded from system stacks (tokens.css) so Serbian diacritics render correctly offline; avoids broken Google Fonts fetch in the desktop app. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("hunt:theme");
          if (t === "dark") document.documentElement.dataset.theme = "dark";
          var m = localStorage.getItem("hunt:mono");
          if (m === "on") document.documentElement.dataset.mono = "on";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
